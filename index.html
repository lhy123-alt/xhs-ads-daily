<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小红书广告投放日报</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#20242c;--muted:#737b8c;--line:#e7e9ef;--red:#ff2442}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;grid-template-rows:auto 1fr}
    .bar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2;box-shadow:0 2px 12px #25304a0a}
    .brand{font-weight:700;margin-right:auto}.brand small{display:block;color:var(--muted);font-weight:400}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,a.link{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);padding:0 12px;font:inherit;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
    button:hover,select:hover,a.link:hover{border-color:#b8beca}button:disabled{opacity:.4;cursor:not-allowed}.latest{color:var(--red);font-size:12px;margin-left:4px}
    .stage{min-height:0;padding:12px}.frame{display:block;width:100%;height:100%;min-height:calc(100vh - 85px);border:0;border-radius:14px;background:#fff;box-shadow:0 4px 20px #25304a12}
    .status{position:fixed;inset:64px 0 0;display:grid;place-items:center;color:var(--muted);pointer-events:none}.hidden{display:none}
    @media(max-width:720px){.bar{align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.controls{width:100%}.controls select{flex:1}.stage{padding:7px}.frame{min-height:calc(100vh - 126px)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">小红书广告投放日报 <span class="latest" id="latestBadge"></span><small>创意维度 · 历史日报</small></div>
    <div class="controls" aria-label="历史日报导航">
      <button id="prev" type="button" aria-label="上一天">← 上一天</button>
      <select id="dateSelect" aria-label="选择日报日期"></select>
      <button id="next" type="button" aria-label="下一天">下一天 →</button>
      <a class="link" id="direct" href="#">复制直达日期</a>
    </div>
  </header>
  <main class="stage">
    <div class="status" id="status">正在加载日报…</div>
    <iframe class="frame" id="reportFrame" title="小红书广告投放日报"></iframe>
  </main>
  <script>
    const select = document.querySelector("#dateSelect");
    const frame = document.querySelector("#reportFrame");
    const status = document.querySelector("#status");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const direct = document.querySelector("#direct");
    const latestBadge = document.querySelector("#latestBadge");
    let dates = [];
    let latest = "";

    function requestedDate() {
      return new URLSearchParams(location.search).get("date");
    }
    function show(date, push = true) {
      const index = dates.indexOf(date);
      if (index < 0) date = latest;
      select.value = date;
      prev.disabled = dates.indexOf(date) <= 0;
      next.disabled = dates.indexOf(date) >= dates.length - 1;
      latestBadge.textContent = date === latest ? "最新" : "";
      status.classList.remove("hidden");
      frame.src = "history/" + date + ".html";
      direct.href = "?date=" + date;
      direct.dataset.url = new URL("?date=" + date, location.href).href;
      if (push) history.pushState({ date }, "", "?date=" + date);
    }
    frame.addEventListener("load", () => status.classList.add("hidden"));
    select.addEventListener("change", () => show(select.value));
    prev.addEventListener("click", () => show(dates[dates.indexOf(select.value) - 1]));
    next.addEventListener("click", () => show(dates[dates.indexOf(select.value) + 1]));
    direct.addEventListener("click", async (event) => {
      event.preventDefault();
      try {
        await navigator.clipboard.writeText(direct.dataset.url);
        const old = direct.textContent;
        direct.textContent = "已复制";
        setTimeout(() => direct.textContent = old, 1200);
      } catch {
        location.href = direct.href;
      }
    });
    addEventListener("popstate", () => show(requestedDate() || latest, false));

    fetch("data/index.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("日期目录加载失败");
        return r.json();
      })
      .then(data => {
        dates = data.dates;
        latest = data.latest;
        for (const date of dates.slice().reverse()) {
          const option = document.createElement("option");
          option.value = date;
          option.textContent = date + (date === latest ? "（最新）" : "");
          select.append(option);
        }
        show(requestedDate() || latest, false);
      })
      .catch(error => status.textContent = error.message);
  </script>
</body>
</html>
